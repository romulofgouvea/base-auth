services:
  postgres:
    image: postgres:16-alpine
    container_name: base_auth_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-base_auth_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-base_auth_pass}
      POSTGRES_DB: ${DB_NAME:-base_auth_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./.docker/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-base_auth_user} -d ${DB_NAME:-base_auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: base_auth_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./.docker/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
