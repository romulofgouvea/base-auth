services:
  postgres:
    image: postgres:16-alpine
    container_name: base_auth_postgres
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      POSTGRES_USER: ${DB_USERNAME:-base_auth_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-base_auth_pass}
      POSTGRES_DB: ${DB_NAME:-base_auth_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - base_auth_shared_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-base_auth_user} -d ${DB_NAME:-base_auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: base_auth_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    networks:
      - base_auth_shared_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  base_auth_shared_net:
    name: base_auth_shared_net
    driver: bridge
